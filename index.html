    <title>カスタムさいころ</title>
    <meta property="og:title" content="カスタムさいころ">
    <meta property="og:description" content="面の数（6面8面12面）や数字を設定できるさいころです。">
    <meta property="og:type" content="website">
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for a clean look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=M+PLUS+Rounded+1c:wght@700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* PC・スマートフォン共通 */
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; }
        body {
            font-family: 'Inter', 'M PLUS Rounded 1c', 'Noto Sans JP', sans-serif;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        #dice-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            z-index: 1;
        }
        #dice-container canvas { display:block; width:100%; height:100%; }
        button, input { touch-action: manipulation; }
        input[type="number"] { font-size: 16px; }
        @media (max-width: 640px) {
            .main-ui {
                height: 100%; height: 100dvh;
                min-height: 0;
                padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
            }
            #start-btn {
                left: max(14px, env(safe-area-inset-left));
                bottom: max(14px, env(safe-area-inset-bottom));
                width: 88px; height: 88px;
                font-size: 17px; border-width: 3px;
                z-index: 3;
            }
            .settings-panel {
                right: max(10px, env(safe-area-inset-right));
                top: auto; bottom: max(14px, env(safe-area-inset-bottom));
                transform: none;
                width: 126px;
                padding: 10px;
                border-radius: 12px;
                z-index: 3;
                max-height: 48dvh;
                overflow-y: auto;
            }
            .settings-panel h3 { font-size: 12px; margin-bottom: 5px; }
            .settings-panel .flex.flex-col { gap: 5px; }
            .settings-panel label, .settings-panel span { font-size: 12px; }
            .settings-panel input[type="radio"] { width: 14px; height: 14px; }
        }
        @media (max-width: 380px) {
            #start-btn { width: 76px; height: 76px; font-size: 15px; }
            .settings-panel { width: 116px; padding: 8px; }
        }
        @media (max-height: 500px) and (orientation: landscape) {
            #start-btn { width: 70px; height: 70px; bottom: 10px; left: 10px; font-size: 15px; }
            .settings-panel { top: 10px; bottom: 10px; right: 10px; width: 125px; max-height: none; padding: 8px; }
        }
    </style>
</head>
<body class="text-gray-800 antialiased" style="background-color: #e0ffff;">

    <!-- 3D Dice Container -->
    <div id="dice-container"></div>

    <!-- Main UI Container -->
    <div class="main-ui relative w-full h-screen p-4 md:p-8 flex flex-col items-center justify-center z-10">

        <!-- Start Button (Bottom Left) -->
        <button id="start-btn" class="absolute bottom-8 left-8 w-24 h-24 md:w-32 md:h-32 bg-pink-100 rounded-full flex items-center justify-center text-center text-red-600 text-xl md:text-2xl font-bold border-4 border-red-300 shadow-[0_6px_0_0_#ef4444] hover:shadow-[0_4px_0_0_#ef4444] active:translate-y-1 active:shadow-none transition-all duration-150 ease-in-out focus:outline-none disabled:bg-gray-400 disabled:text-white disabled:shadow-none disabled:translate-y-0 disabled:cursor-not-allowed">
            スタート
        </button>

        <!-- Settings Panel (Right Side) -->
        <div class="settings-panel absolute top-1/2 right-0 transform -translate-y-1/2 bg-gray-900 bg-opacity-80 backdrop-blur-sm p-4 rounded-l-lg rounded-r-none shadow-2xl w-24 md:w-28 space-y-4 text-white">
            <!-- Number of Faces Setting -->
            <div>
                <h3 class="text-xs md:text-sm font-semibold mb-2 text-gray-200">面の数</h3>
                <div class="flex flex-col space-y-2 text-sm">
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="radio" name="sides" value="6" class="form-radio text-indigo-500" checked>
                        <span>6面</span>
                    </label>
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="radio" name="sides" value="8" class="form-radio text-indigo-500">
                        <span>8面</span>
                    </label>
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="radio" name="sides" value="12" class="form-radio text-indigo-500">
                        <span>12面</span>
                    </label>
                </div>
            </div>

            <!-- Number Range Setting -->
            <div>
                <h3 class="text-xs md:text-sm font-semibold mb-2 text-gray-200">数字の範囲</h3>
                <div class="space-y-2 text-sm">
                    <div>
                        <label for="start-number" class="block mb-1 text-xs">始まりの数</label>
                        <input type="number" id="start-number" value="1" class="w-full bg-gray-700 text-white rounded px-2 py-1 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block mb-1 text-xs">終わりの数</label>
                        <span id="end-number" class="w-full inline-block bg-gray-800 text-gray-400 rounded px-2 py-1">6</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Three.js Library -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

        // --- DOM Elements ---
        const diceContainer = document.getElementById('dice-container');
        const startBtn = document.getElementById('start-btn');
        const startNumberInput = document.getElementById('start-number');
        const endNumberSpan = document.getElementById('end-number');
        const sidesRadios = document.querySelectorAll('input[name="sides"]');

        // --- State ---
        let scene, camera, renderer, dice;
        let isRolling = false, isSettling = false;
        let lastResult = 0;
        let targetQuaternion = new THREE.Quaternion();
        let currentSides = 6;
        let startNumber = 1;
        
        let currentFacesData = [];

        const faceColors = {
            base: new THREE.Color(0xffffff),
            highlight: new THREE.Color(0xFFE4E1) // MistyRose
        };

        // --- Three.js Initialization ---
        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = window.innerWidth < 640 ? 14 : 12; // スマホでは全体が見える距離に調整

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            diceContainer.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 2.5);
            directionalLight.position.set(5, 10, 7.5);
            scene.add(directionalLight);
            
            createDice();
            animate();
            setupUI();
        }

        // ジオメトリから動的にすべての面の法線と中心距離を抽出する関数
        function extractPolyhedronData(geometry) {
            const posAttr = geometry.attributes.position;
            const index = geometry.index;
            const faces = [];
            const vA = new THREE.Vector3();
            const vB = new THREE.Vector3();
            const vC = new THREE.Vector3();
            const ab = new THREE.Vector3();
            const ac = new THREE.Vector3();
            const targetVector = new THREE.Vector3(0, 0, 1);

            const count = index ? index.count : posAttr.count;

            for (let i = 0; i < count; i += 3) {
                if (index) {
                    vA.fromBufferAttribute(posAttr, index.getX(i));
                    vB.fromBufferAttribute(posAttr, index.getX(i + 1));
                    vC.fromBufferAttribute(posAttr, index.getX(i + 2));
                } else {
                    vA.fromBufferAttribute(posAttr, i);
                    vB.fromBufferAttribute(posAttr, i + 1);
                    vC.fromBufferAttribute(posAttr, i + 2);
                }

                // 三角形の法線を計算
                ab.subVectors(vB, vA);
                ac.subVectors(vC, vA);
                const normal = new THREE.Vector3().crossVectors(ab, ac).normalize();
                
                // 法線が必ず外側を向くように補正
                const center = new THREE.Vector3().add(vA).add(vB).add(vC).divideScalar(3);
                if (normal.dot(center) < 0) {
                    normal.negate();
                }

                // 中心からの距離
                const dist = vA.dot(normal);

                // 重複する面（同じ法線を持つ三角形）を除外して登録
                let isUnique = true;
                for (const f of faces) {
                    if (f.normal.dot(normal) > 0.99) {
                        isUnique = false;
                        break;
                    }
                }

                if (isUnique) {
                    const q = new THREE.Quaternion().setFromUnitVectors(normal, targetVector);
                    faces.push({ normal: normal, distance: dist, quaternion: q });
                }
            }
            return faces;
        }

        function createDiceFaceTexture(value, isDotPattern) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 256;
            canvas.height = 256;
            context.fillStyle = '#FFFFFF';
            context.fillRect(0, 0, canvas.width, canvas.height);

            if (isDotPattern) {
                if (startNumber === 1 && value === 1) {
                    context.fillStyle = '#dc2626'; // Red for '1'
                } else {
                    context.fillStyle = '#000000';
                }
                const dotRadius = 22;
                const positions = {
                    1: [[0.5, 0.5]], 2: [[0.25, 0.75], [0.75, 0.25]],
                    3: [[0.25, 0.25], [0.5, 0.5], [0.75, 0.75]],
                    4: [[0.25, 0.25], [0.75, 0.25], [0.25, 0.75], [0.75, 0.75]],
                    5: [[0.25, 0.25], [0.75, 0.25], [0.5, 0.5], [0.25, 0.75], [0.75, 0.75]],
                    6: [[0.25, 0.25], [0.75, 0.25], [0.25, 0.75], [0.75, 0.75], [0.25, 0.5], [0.75, 0.5]]
                };
                const dotPositions = positions[value] || [];
                dotPositions.forEach(([x, y]) => {
                    context.beginPath();
                    context.arc(x * canvas.width, y * canvas.height, dotRadius, 0, Math.PI * 2);
                    context.fill();
                });
            } else {
                context.fillStyle = '#000000';
                context.font = 'bold 150px Inter, "Noto Sans JP", sans-serif';
                context.textAlign = 'center';
                context.textBaseline = 'middle';
                context.fillText(value, canvas.width / 2, canvas.height / 2);
            }
            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.MeshStandardMaterial({ map: texture, metalness: 0.1, roughness: 0.4 });
            material.color.set(faceColors.base);
            return material;
        }
        
        // 8面・12面用の透明背景の数字テクスチャを作成する関数
        function createTextMesh(text, planeSize) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 256;
            canvas.height = 256;
            
            // 背景は透明
            context.clearRect(0, 0, canvas.width, canvas.height);
            
            context.fillStyle = '#000000';
            // フォントサイズを可能な限り大きく（2桁数字も収まるように調整）
            context.font = 'bold 160px Inter, "Noto Sans JP", sans-serif';
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            
            // 視認性を上げるための白フチ
            context.lineWidth = 12;
            context.strokeStyle = '#ffffff';
            // textBaselineがmiddleでもフォントによっては上にズレるため、少しY座標を調整
            context.strokeText(text, canvas.width / 2, canvas.height / 2 + 10);
            context.fillText(text, canvas.width / 2, canvas.height / 2 + 10);
            
            const texture = new THREE.CanvasTexture(canvas);
            // transparentにして背景を抜く
            const material = new THREE.MeshBasicMaterial({ 
                map: texture, 
                transparent: true,
                alphaTest: 0.1,
                depthWrite: false // z-fighting防止
            });
            const geometry = new THREE.PlaneGeometry(planeSize, planeSize);
            return new THREE.Mesh(geometry, material);
        }

        // 8面・12面の各面に数字のメッシュを配置する関数
        function addTextFacesToDice(diceMesh, facesData, sides) {
            // Planeのサイズを大きくして面にフィットさせる
            const planeSize = sides === 8 ? 3.8 : 3.0;

            for (let i = 0; i < Math.min(sides, facesData.length); i++) {
                const value = startNumber + i;
                const textMesh = createTextMesh(value, planeSize);
                
                const face = facesData[i];
                
                // 中心から面までの距離に少しオフセットを足して配置（めり込み防止）
                const offsetDistance = face.distance + 0.05;
                
                // 「正面を向かせるための回転」の逆回転を適用して、ローカル上の正しい面に配置する
                const invQuat = face.quaternion.clone().invert();
                textMesh.position.set(0, 0, offsetDistance);
                textMesh.position.applyQuaternion(invQuat);
                textMesh.quaternion.copy(invQuat);
                
                diceMesh.add(textMesh);
            }
        }

        function resetFaceColors() {
            if (!dice) return;
            if (currentSides === 6) {
                dice.material.forEach(material => material.color.set(faceColors.base));
            } else {
                dice.material.color.set(faceColors.base);
            }
        }

        // メモリリークを防ぐための解放処理
        function disposeDice() {
            if (!dice) return;
            scene.remove(dice);
            
            if (dice.geometry) dice.geometry.dispose();
            if (Array.isArray(dice.material)) {
                dice.material.forEach(m => {
                    if (m.map) m.map.dispose();
                    m.dispose();
                });
            } else if (dice.material) {
                if (dice.material.map) dice.material.map.dispose();
                dice.material.dispose();
            }
            
            // 子要素（テキストMesh）の解放
            dice.children.forEach(child => {
                if (child.geometry) child.geometry.dispose();
                if (child.material) {
                    if (child.material.map) child.material.map.dispose();
                    child.material.dispose();
                }
            });
        }

        function createDice() {
            disposeDice();

            let geometry, material;
            const size = 1.5;

            if (currentSides === 6) {
                geometry = new RoundedBoxGeometry(5 * size, 5 * size, 5 * size, 6, 0.8 * size);
                const isStandardRange = (startNumber === 1);
                const faceValues = [
                    startNumber + 2, startNumber + 3, startNumber + 4, 
                    startNumber + 1, startNumber, startNumber + 5
                ];
                material = faceValues.map(val => createDiceFaceTexture(val, isStandardRange));
                dice = new THREE.Mesh(geometry, material);
                scene.add(dice);
            } else {
                if (currentSides === 8) {
                    geometry = new THREE.OctahedronGeometry(3.5 * size);
                } else { // 12 sides
                    geometry = new THREE.DodecahedronGeometry(3.5 * size);
                }
                
                // ジオメトリから実際の面の法線と距離を抽出
                currentFacesData = extractPolyhedronData(geometry);

                material = new THREE.MeshStandardMaterial({ 
                    color: 0xffffff, 
                    metalness: 0.2, 
                    roughness: 0.1,
                    flatShading: true // 各面がはっきり見えるようにフラットシェーディングを有効化
                });
                dice = new THREE.Mesh(geometry, material);
                
                // 各面に数字を描画したMeshを追加
                addTextFacesToDice(dice, currentFacesData, currentSides);
                
                scene.add(dice);
            }
        }
        
        function getTargetRotation(sides, result) {
            const resultIndex = result - startNumber;

            if (sides === 6) {
                const q = new THREE.Quaternion();
                const e = new THREE.Euler();
                const pi_2 = Math.PI / 2;
                const targetFace = resultIndex + 1;
                switch(targetFace) {
                    case 1: e.set(0, 0, 0); break; case 6: e.set(0, Math.PI, 0); break;
                    case 3: e.set(0, pi_2, 0); break; case 4: e.set(0, -pi_2, 0); break;
                    case 5: e.set(-pi_2, 0, 0); break; case 2: e.set(pi_2, 0, 0); break;
                    default: e.set(0,0,0);
                }
                return q.setFromEuler(e);
            } else {
                // 抽出した面のデータから該当する回転情報を返す
                if (currentFacesData && currentFacesData[resultIndex]) {
                    return currentFacesData[resultIndex].quaternion;
                }
            }
            return new THREE.Quaternion();
        }

        function setupUI() {
            startBtn.addEventListener('click', rollDice);
            sidesRadios.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    currentSides = parseInt(e.target.value, 10);
                    updateNumberRange(); createDice();
                });
            });
            startNumberInput.addEventListener('input', (e) => {
                const val = e.target.value;
                startNumber = val === '' ? 1 : parseInt(val, 10);
                if (isNaN(startNumber)) startNumber = 1;
                updateNumberRange();
                createDice();
            });
            window.addEventListener('resize', onWindowResize);
        }
        
        function updateNumberRange() {
             const endNumber = startNumber + currentSides - 1;
             endNumberSpan.textContent = isNaN(endNumber) ? '' : endNumber;
        }

        function rollDice() {
            if (isRolling || isSettling) return;
            isRolling = true;
            resetFaceColors();
            startBtn.disabled = true;

            setTimeout(() => {
                isRolling = false;
                startBtn.disabled = false;
                
                const endNumber = startNumber + currentSides - 1;
                const result = Math.floor(Math.random() * (endNumber - startNumber + 1)) + startNumber;
                lastResult = result;
                
                targetQuaternion = getTargetRotation(currentSides, result);
                isSettling = true;
            }, 2000);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (dice) {
                if (isRolling) {
                    dice.rotation.x += 0.1;
                    dice.rotation.y += 0.12;
                } else if (isSettling) {
                    dice.quaternion.slerp(targetQuaternion, 0.08);
                    if (dice.quaternion.angleTo(targetQuaternion) < 0.01) {
                        dice.quaternion.copy(targetQuaternion);
                        isSettling = false;
                    }
                }
            }
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            camera.aspect = width / height;
            // 縦長スマホでもさいころ全体が画面内に収まるように調整
            camera.position.z = width < 640 ? 14 : 12;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        }

        init();
    </script>
</body>
</html>
